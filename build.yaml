# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano/nrf52840/zmk
#     shield: reviung41
#   - board: nice_nano/nrf52840/zmk
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: nice_nano/nrf52840/zmk
    shield: pacane_left
    snippet: studio-rpc-usb-uart
  - board: nice_nano/nrf52840/zmk
    shield: pacane_right
    snippet: studio-rpc-usb-uart
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
  - board: nice_nano/nrf52840/zmk
    shield: pacane_corne_left
  - board: nice_nano/nrf52840/zmk
    shield: pacane_corne_right
  - board: nice_nano/nrf52840/zmk
    shield: temper_left nice_view_adapter nice_view
  - board: nice_nano/nrf52840/zmk
    shield: temper_right nice_view_adapter nice_view
  - board: nice_nano/nrf52840/zmk
    shield: trackball
  - board: nice_nano/nrf52840/zmk
    shield: pacane_dongle
    snippet: studio-rpc-usb-uart
  - board: nice_nano/nrf52840/zmk
    shield: pacane_dongle_left
  # Pacino (hand-wired). Default keymap = boards/shields/pacino/pacino.keymap (the temper variant);
  # the *_pacane artifacts are the same shields built with the pacane variant.
  - board: nice_nano/nrf52840/zmk
    shield: pacino_left
  - board: nice_nano/nrf52840/zmk
    shield: pacino_right
  - board: nice_nano/nrf52840/zmk
    shield: pacino_left
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/boards/shields/pacino/pacino_pacane.keymap
    artifact-name: pacino_left_pacane
  - board: nice_nano/nrf52840/zmk
    shield: pacino_right
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/boards/shields/pacino/pacino_pacane.keymap
    artifact-name: pacino_right_pacane
  # Pacino slim PCB build: the reversible board puts the matrix on different pins per half, so it
  # is its own shield; same keymaps.
  - board: nice_nano/nrf52840/zmk
    shield: pacino_pcb_left
  - board: nice_nano/nrf52840/zmk
    shield: pacino_pcb_right
  - board: nice_nano/nrf52840/zmk
    shield: pacino_pcb_left
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/boards/shields/pacino/pacino_pacane.keymap
    artifact-name: pacino_pcb_left_pacane
  - board: nice_nano/nrf52840/zmk
    shield: pacino_pcb_right
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/boards/shields/pacino/pacino_pacane.keymap
    artifact-name: pacino_pcb_right_pacane
  # Pacino with the nice!view: five wires to pro_micro 1 (CS), 2 (MOSI), 3 (SCK) + VCC/GND, no
  # matrix change (docs/pacino-nice-view.md). Same keymap; the shield string adds the display.
  - board: nice_nano/nrf52840/zmk
    shield: pacino_left nice_view_adapter nice_view
  - board: nice_nano/nrf52840/zmk
    shield: pacino_right nice_view_adapter nice_view
