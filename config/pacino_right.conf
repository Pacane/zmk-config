# TEMPORARY: only the right half is wired for now, so it plays the central (the role the shield's
# Kconfig.defconfig gives the left half). Delete this file once the left half exists, then:
#   1. flash settings_reset on the right half (it will have stored bonds as a central),
#   2. flash the normal pacino_right firmware on it and pacino_left on the left,
#   3. pair the host again -- with the left half this time.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_KEYBOARD_NAME="Pacino"
