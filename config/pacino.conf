# Pacino, hand-wired build (the slim PCB build reads pacino_pcb.conf)
# no deep sleep: waking from it takes seconds, and the 2000 mAh cell does not need it
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_POINTING=y
# battery level on the host: the central's own, plus the peripheral's as a second battery (most hosts show
# only the first; a BLE GATT browser shows both)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
